[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.lints.clippy]
# No unwrap() anywhere — matches this project's "no unwrap on any reachable
# path" rule (CLAUDE.md); combined with `-D warnings` in `just lint`/CI, this
# turns any unwrap() into a hard build failure, not just a style nit.
unwrap_used = "warn"
# Catch stray debugging leftovers before they ship.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# csv-select ships as a prebuilt binary (see binaries.yml) — optimize for
# that, not just local `cargo build --release` iteration speed.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
