[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.lints.clippy]
# No unwrap() anywhere reachable from user/file/participant input. Combined
# with `-D warnings` in `just lint`/CI, this turns any unwrap() into a hard
# build failure, not just a style nit.
unwrap_used = "warn"
# Catch stray debugging leftovers before they ship.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Public API doc completeness: keep # Errors/# Panics/# Safety sections
# honest as the API surface grows, instead of relying on review alone.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"

# csv-select ships as a prebuilt binary (see binaries.yml) — optimize for
# that, not just local `cargo build --release` iteration speed.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# CI-only: same as `release` but thin LTO, so PR checks don't pay fat LTO's
# link time on every push. Fat LTO stays reserved for the artifacts actually
# shipped (see binaries.yml) — this profile is never what ships.
[profile.ci-release]
inherits = "release"
lto = "thin"
codegen-units = 16
