services:
  minio:
    # Mirrored from quay.io/minio/minio, which now rejects anonymous pulls.
    image: ghcr.io/vim89/datacrate-minio:RELEASE.2025-09-07T16-13-09Z@sha256:9966a92a734f9411e32f4f41d7d9d826fcdc0f68c4e20b70295bd4e7c11f8a2f
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API — this is the port run-s3-pipeline talks to
      - "9001:9001"   # web console — open this one in a browser
    environment:
      # MinIO's own well-known local-dev default, not a leaked credential.
      # This container only ever runs on localhost.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
volumes:
  minio-data:
