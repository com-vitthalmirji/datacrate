name: Docs

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Turns rustdoc warnings (including broken intra-doc links) into a build
  # failure, the same way `-D warnings` already gates clippy in ci.yml.
  RUSTDOCFLAGS: "-D warnings"

jobs:
  # Always runs, so a future required-status-check for `build` still gets a
  # status posted. Path filtering happens by skipping `build` below, not by
  # skipping the workflow trigger itself.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'crates/dtl-core/**'
              - 'crates/csv-cli/**'
              - 'book/**'
              - '.github/workflows/docs.yml'

  build:
    needs: changes
    runs-on: ubuntu-latest
    if: "needs.changes.outputs.docs == 'true' && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip release]')"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pinned, not floating: a silent mdBook upgrade should never be able to
      # turn a green build red on an unrelated commit.
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - run: cargo doc --no-deps -p dtl-core -p csv-select-cli
      - run: mdbook build book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: "github.repository == 'com-vitthalmirji/datacrate' && github.ref == 'refs/heads/main'"
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - run: mdbook build book
      - run: cargo doc --no-deps -p dtl-core -p csv-select-cli
      - run: |
          mkdir -p book/book/api
          cp -r target/doc/* book/book/api/
          echo '<meta http-equiv="refresh" content="0; url=dtl_core/index.html">' > book/book/api/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book/book
      - id: deployment
        uses: actions/deploy-pages@v4
