name: Scala CI

# pull_request only — see ci.yml's `on:` comment for why the push:main
# trigger was removed. Branch protection on `main` requires `scala-build`/
# `comet-benchmark`/`arrow-interop` to pass, so re-running them on the
# merge commit would be retesting a tree already proven green.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always runs, so a future required-status-check still gets a status
  # posted even on Rust-only changes. Path filtering happens by skipping
  # `build` below, not by skipping the workflow trigger itself.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      scala: ${{ steps.filter.outputs.scala }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            scala:
              - 'scala/**'
              - '.github/workflows/scala-ci.yml'

  # Named `scala-build`, not `build`: `docs.yml` has its own job literally
  # named `build`, and branch-protection required-status-checks match by
  # name only, with no way to disambiguate same-named jobs across
  # workflows — a collision here would let either job's success silently
  # satisfy the other's requirement.
  scala-build:
    needs: changes
    runs-on: ubuntu-latest
    if: "needs.changes.outputs.scala == 'true' && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip release]')"
    defaults:
      run:
        working-directory: scala/comet-interop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: sbt/setup-sbt@v1
      - run: sbt -batch compile
      - run: sbt -batch test

  # Scenario B/C (architecture amendment, decision: option (iii)): compiles
  # the real Scala Spark driver in CI (never locally, per the standing
  # CI-only-execution policy) and runs it twice as separate spark-submit
  # invocations against the already-pinned apache/spark:4.1.3-java17
  # container - once without Comet (Scenario B, baseline) and once with the
  # pinned Comet jar (Scenario C) - reusing the same fixture file for both.
  # wrapping_add_simd (Scenario A) is never invoked here; this job only
  # proves Comet's own already-native COUNT/SUM/filter operators.
  comet-benchmark:
    needs: changes
    runs-on: ubuntu-latest
    if: "needs.changes.outputs.scala == 'true' && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip release]')"
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      comet-jar-file: comet-spark-spark4.1_2.13-0.16.0.jar
      comet-maven-path: org/apache/datafusion/comet-spark-spark4.1_2.13/0.16.0/comet-spark-spark4.1_2.13-0.16.0.jar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: sbt/setup-sbt@v1

      - name: Package the Scala Spark driver
        working-directory: scala/comet-benchmark
        run: sbt -batch package

      # Same integrity policy the justfile's spark-comet-jar recipe already
      # uses (curl + .sha1 compare via shasum), inlined here because this is
      # the first workflow to ever provision this jar in CI.
      - name: Download and verify the pinned Comet jar
        run: |
          set -euo pipefail
          jar="benchmark/spark-comet/${{ env.comet-jar-file }}"
          curl -fsSL -o "$jar" "https://repo1.maven.org/maven2/${{ env.comet-maven-path }}"
          curl -fsSL -o "$jar.sha1" "https://repo1.maven.org/maven2/${{ env.comet-maven-path }}.sha1"
          expected=$(cat "$jar.sha1")
          actual=$(shasum -a 1 "$jar" | cut -d' ' -f1)
          if [ "$expected" != "$actual" ]; then
            echo "checksum mismatch for $jar: expected $expected, got $actual" >&2
            exit 1
          fi

      - name: Start the pinned Spark container
        run: docker compose -f docker-compose.spark-comet.yml up -d

      - name: Copy the built driver jar into the container
        run: |
          set -euo pipefail
          container=$(docker compose -f docker-compose.spark-comet.yml ps -q spark)
          docker cp scala/comet-benchmark/target/scala-2.13/comet-benchmark_2.13-0.1.0.jar \
            "$container:/spark-comet/comet-benchmark-driver.jar"

      - name: Record Spark/Scala/Comet/Java versions
        if: always()
        run: |
          mkdir -p artifacts
          {
            java -version
            echo "comet jar: ${{ env.comet-jar-file }}"
            docker compose -f docker-compose.spark-comet.yml exec -T spark /opt/spark/bin/spark-submit --version
          } > artifacts/versions.log 2>&1 || true

      # Scenario B: baseline, no Comet. Also generates the shared fixture
      # (same deterministic amountFor() formula as the Rust fixture
      # generator, independently reproduced in Scala - see
      # OrdersAggregateDriver's doc comment) that Scenario C reuses below
      # without regenerating.
      - name: Run Scenario B (baseline, no Comet)
        run: |
          set -o pipefail
          docker compose -f docker-compose.spark-comet.yml exec -T spark \
            bash -c 'time /opt/spark/bin/spark-submit \
              --class cometbenchmark.OrdersAggregateDriver \
              /spark-comet/comet-benchmark-driver.jar \
              --output /tmp/ci-orders.parquet --rows 2000 \
              --generate-fixture --require-comet false' \
            2>&1 | tee artifacts/scenario-b.log

      # Scenario C: same driver jar, same fixture, with the pinned Comet jar
      # and its documented config (matching the justfile's comet-accelerated
      # recipe exactly: spark.plugins, spark.comet.enabled, offHeap memory,
      # the Comet shuffle manager). --require-comet true fails the run if
      # the executed plan does not show native Comet execution.
      - name: Run Scenario C (with pinned Comet)
        if: always()
        run: |
          set -o pipefail
          docker compose -f docker-compose.spark-comet.yml exec -T spark \
            bash -c 'time /opt/spark/bin/spark-submit \
              --class cometbenchmark.OrdersAggregateDriver \
              --jars /spark-comet/${{ env.comet-jar-file }} \
              --conf spark.plugins=org.apache.spark.CometPlugin \
              --conf spark.comet.enabled=true \
              --conf spark.memory.offHeap.enabled=true \
              --conf spark.memory.offHeap.size=2g \
              --conf spark.shuffle.manager=org.apache.spark.sql.comet.execution.shuffle.CometShuffleManager \
              /spark-comet/comet-benchmark-driver.jar \
              --output /tmp/ci-orders.parquet --rows 2000 \
              --require-comet true' \
            2>&1 | tee artifacts/scenario-c.log

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comet-benchmark-evidence
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn

      - name: Stop the Spark container
        if: always()
        run: docker compose -f docker-compose.spark-comet.yml down

  # Phase E1 + E3 (docs/internals/experiment.md section 13): the same
  # Scala-object <-> Arrow <-> Rust-kernel <-> Arrow <-> Scala-object
  # driver, run against two Rust kernel binaries that differ only in how
  # they read the published IPC file - ordinary FileReader (E1) vs. the
  # zero-copy mmap path from Phase D (E3, the plan's "separate-process
  # alternative"). Reusing one driver for both legs means any difference
  # is attributable only to the Rust-side reading mechanism, not
  # incidental differences between two near-duplicate drivers. Not the C
  # Data Interface investigation (Phase E2 - blocked, see the ledger) and
  # not Spark/Comet (comet-benchmark above) - independent legs.
  arrow-interop:
    needs: changes
    runs-on: ubuntu-latest
    if: "needs.changes.outputs.scala == 'true' && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip release]')"
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: sbt/setup-sbt@v1

      - name: Build the Rust subprocess kernels
        run: |
          cargo build --profile ci-release --locked -p pipeline --bin arrow-interop-kernel
          cargo build --profile ci-release --locked -p pipeline --bin arrow-interop-kernel-mmap

      - name: Run the Scala driver (Phase E1, ordinary FileReader kernel)
        working-directory: scala/arrow-interop
        run: |
          sbt -batch "run --rows=500000 --kernel-binary=${{ github.workspace }}/target/ci-release/arrow-interop-kernel"

      - name: Run the Scala driver (Phase E3, mmap kernel)
        working-directory: scala/arrow-interop
        run: |
          sbt -batch "run --rows=500000 --kernel-binary=${{ github.workspace }}/target/ci-release/arrow-interop-kernel-mmap"
