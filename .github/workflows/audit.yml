name: Audit

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  schedule:
    - cron: "0 6 * * 1"

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2026-0194/0195: quick-xml DoS advisories, pulled in transitively via
          # object_store's S3 XML parsing (polars dependency). Not reachable by workshop
          # participant input. object_store pins quick-xml ^0.38, so the fixed 0.41 can't
          # land via lockfile update alone. See docs/adr/0009-supply-chain-policy-gate.md.
          # RUSTSEC-2025-0141: bincode unmaintained flag, pulled in transitively via
          # polars-utils (polars is an optional, non-default feature used only by the
          # scale-aggregate-polars benchmark binary). Not a vulnerability, and not called
          # directly by this repo. Already ignored in deny.toml; see docs/adr/0009.
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195,RUSTSEC-2025-0141
