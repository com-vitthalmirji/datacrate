name: Binaries

on:
  push:
    tags:
      - "csv-select-cli-v*"

permissions:
  contents: write

jobs:
  upload:
    strategy:
      matrix:
        # Windows paused for now; re-add x86_64-pc-windows-msvc (target +
        # matching include entry) when needed.
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: csv-select
          manifest_path: crates/csv-cli/Cargo.toml
          target: ${{ matrix.target }}
          archive: csv-select-$target
          token: ${{ secrets.GH_TOKEN }}
