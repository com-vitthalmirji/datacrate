services:
  spark-master:
    image: apache/spark:4.1.3-java17
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    hostname: spark-master
    ports:
      - "8080:8080"
    volumes:
      - ./benchmark/spark-comet:/spark-comet
      - ./benchmark/join-shuffle:/join-shuffle

  spark-worker-1:
    image: apache/spark:4.1.3-java17
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    volumes:
      - ./benchmark/spark-comet:/spark-comet
      - ./benchmark/join-shuffle:/join-shuffle

  spark-worker-2:
    image: apache/spark:4.1.3-java17
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    volumes:
      - ./benchmark/spark-comet:/spark-comet
      - ./benchmark/join-shuffle:/join-shuffle
