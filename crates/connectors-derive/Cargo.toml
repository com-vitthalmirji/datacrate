[package]
name = "connectors-derive"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }

[dev-dependencies]
contracts = { version = "0.2.0", path = "../contracts", features = ["arrow"] }
datafusion = "55.1.0"
parquet = { version = "59.3.0", default-features = false, features = ["snap"] }
pipeline = { version = "0.1.0", path = "../pipeline" }
tempfile = "3.27.0"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }
trybuild = "1"
