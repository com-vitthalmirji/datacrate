[package]
name = "typestate"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
contracts = { version = "0.2.0", path = "../contracts", features = ["arrow-validation"] }
arrow = "59"
object_store = "0.13.2"
pipeline = { path = "../pipeline" }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt"] }
trybuild = "1"
