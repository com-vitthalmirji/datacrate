[package]
name = "schema-codegen"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[features]
# Each steward-input format is its own feature so the default build (just
# the Parquet-reading half used by scaffold-cli and build.rs gates) never
# pulls in a YAML or XML parser it doesn't need.
dbt = ["dep:serde", "dep:serde_yaml"]
erwin = ["dep:roxmltree"]
# Delta reads its schema through a DataFusion `TableProvider`, so this
# feature carries both the table library and the trait it returns.
delta = ["dep:deltalake", "dep:datafusion", "dep:tokio", "dep:url"]

[dependencies]
arrow-schema = "59"
parquet = { version = "59.3.0", default-features = false, features = ["arrow"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "printing"] }
prettyplease = "0.2"
serde = { version = "1", features = ["derive"], optional = true }
serde_yaml = { version = "0.9", optional = true }
roxmltree = { version = "0.20", optional = true }
deltalake = { version = "1.1.2", features = ["datafusion"], optional = true }
datafusion = { version = "55.1.0", optional = true }
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
arrow-array = "59"
tempfile = "3.27.0"
