[package]
name = "pipeline"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
arrow = "59"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
datafusion = "55.1.0"
object_store = { version = "0.14", features = ["aws"] }
parquet = { version = "59.3.0", default-features = false, features = ["arrow", "snap", "zstd"] }
tempfile = "3.27.0"
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
